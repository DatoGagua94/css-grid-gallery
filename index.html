<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animal photo gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Animal photo gallery</h1>
    </header>
    <main>
      <div class="gallery">
        <div class="gallery-item">
          <h3>Elephant</h3>  
          <img src="Images/Elephant.jpg" alt="Elephant" />
        </div>

        <div class="gallery-item">
          <h3>Giraffe</h3> 
          <img src="Images/Giraffe.jpg" alt="Giraffe" />
        </div>

        <div class="gallery-item">
          <h3>Lion</h3> 
          <img src="Images/Lion.jpg" alt="Lion" />
        </div>

        <div class="gallery-item">
          <h3>Zebra</h3> 
          <img src="Images/Zebra.jpg" alt="Zebra" />
        </div>

        <div class="gallery-item">
          <h3>Panda</h3> 
          <img src="Images/Panda.jpg" alt="Panda" />
        </div>

        <div class="gallery-item">
          <h3>Parrot</h3> 
          <img src="Images/Parrot.jpg" alt="Parrot" />
        </div>

        <div class="gallery-item">
          <h3>Tiger</h3> 
          <img src="Images/Tiger.jpg" alt="Tiger" />
        </div>

        <div class="gallery-item">
          <h3>Llama</h3> 
          <img src="Images/Llama.jpg" alt="Llama" />
        </div>
      </div>
    </main>
  </body>
</html>
